<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Campus ISSCA Business School à Sousse — Master Management des Startups et de l'IA">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2347" />
      <stop offset="55%" stop-color="#1C4E9E" />
      <stop offset="100%" stop-color="#143A78" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D11623" />
      <stop offset="100%" stop-color="#E62E3B" />
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#archGrid)" />

  <!-- Architectural facade silhouette of ISSCA Campus Akouda, Sousse -->
  <g transform="translate(50, 90)">
    <!-- Campus Main Wing -->
    <rect x="40" y="90" width="620" height="330" rx="12" fill="#0B1933" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
    <!-- Top Roofline & Red Institutional Accent -->
    <rect x="30" y="78" width="640" height="14" rx="4" fill="url(#accentRed)" />
    <rect x="230" y="42" width="240" height="40" rx="6" fill="#0F2347" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="350" y="68" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ISSCA SOUSSE</text>

    <!-- Glazed Curtain Wall Bays -->
    <g fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1">
      <rect x="70" y="120" width="110" height="85" rx="6" />
      <rect x="200" y="120" width="110" height="85" rx="6" />
      <rect x="390" y="120" width="110" height="85" rx="6" />
      <rect x="520" y="120" width="110" height="85" rx="6" />

      <rect x="70" y="225" width="110" height="85" rx="6" />
      <rect x="200" y="225" width="110" height="85" rx="6" />
      <rect x="390" y="225" width="110" height="85" rx="6" />
      <rect x="520" y="225" width="110" height="85" rx="6" />
    </g>

    <!-- Central Entrance Atrium -->
    <rect x="322" y="115" width="56" height="305" rx="6" fill="#1C4E9E" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="295" y="330" width="110" height="90" rx="6" fill="#09152B" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Forecourt & Perspective Lines -->
    <path d="M 0 420 L 700 420 L 740 485 L -40 485 Z" fill="#0A1831" fill-opacity="0.7" />
    <line x1="350" y1="420" x2="350" y2="485" stroke="#D11623" stroke-width="3" />
  </g>

  <!-- Editorial Overlay Card 1: Structure du parcours -->
  <g transform="translate(56, 370)">
    <rect width="320" height="164" rx="14" fill="#FFFFFF" filter="drop-shadow(0 16px 32px rgba(10,20,40,0.35))" />
    <rect x="0" y="0" width="8" height="164" rx="4" fill="#D11623" />
    <text x="28" y="36" fill="#D11623" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FORMATION MANAGEMENT &amp; IA</text>
    <text x="28" y="64" fill="#0F2347" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Pilotage de Startups &amp; IA</text>
    <text x="28" y="90" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Stratégie, Lean Startup, Data Science,</text>
    <text x="28" y="110" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Machine Learning &amp; Gouvernance IA</text>
    <rect x="28" y="126" width="190" height="24" rx="12" fill="#F1F5F9" />
    <text x="40" y="142" fill="#1C4E9E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">4 semestres · Stage PFE 4-6 mois</text>
  </g>

  <!-- Editorial Overlay Card 2: Agrément & Campus -->
  <g transform="translate(416, 404)">
    <rect width="328" height="130" rx="14" fill="#0F2347" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
    <circle cx="36" cy="40" r="16" fill="#D11623" />
    <path d="M 30 40 L 34 44 L 43 35" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="36" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Agrément MESRS n° 01/2018</text>
    <text x="64" y="56" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Établissement privé d’enseignement supérieur</text>
    <line x1="24" y1="76" x2="304" y2="76" stroke="#FFFFFF" stroke-opacity="0.14" />
    <text x="24" y="102" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Campus Akouda · Sousse, Tunisie · Niv. Bac+5</text>
  </g>
</svg>
