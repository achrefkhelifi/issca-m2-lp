<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Pédagogie par l'action à ISSCA Business School — Projets IA, Startups et Immersion en entreprise">
  <defs>
    <linearGradient id="pedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>
  <rect width="720" height="520" rx="20" fill="url(#pedBg)" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Header Bar -->
  <rect x="32" y="32" width="656" height="68" rx="12" fill="#0F2347" />
  <circle cx="64" cy="66" r="12" fill="#D11623" />
  <text x="90" y="61" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">APPRENDRE EN FAISANT · LEARNING BY DOING</text>
  <text x="90" y="81" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Approche pédagogique hybride : chercheurs académiques &amp; experts métiers</text>

  <!-- 4 Structured Pedagogical Pillars Grid -->
  <g transform="translate(32, 124)">
    <rect x="0" y="0" width="316" height="164" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#FEE2E2" />
    <text x="40" y="46" text-anchor="middle" fill="#D11623" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">01</text>
    <text x="20" y="86" fill="#0F2347" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Ateliers Startups &amp; Projets IA</text>
    <text x="20" y="112" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cas réels de Lean Startup, Data Science,</text>
    <text x="20" y="132" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">systèmes d’aide à la décision et Scrum.</text>

    <rect x="340" y="0" width="316" height="164" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="360" y="20" width="40" height="40" rx="10" fill="#DBEAFE" />
    <text x="380" y="46" text-anchor="middle" fill="#1C4E9E" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">02</text>
    <text x="360" y="86" fill="#0F2347" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Chercheurs &amp; Praticiens</text>
    <text x="360" y="112" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Enseignement assuré par des universitaires</text>
    <text x="360" y="132" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">et des professionnels en activité.</text>

    <rect x="0" y="188" width="316" height="164" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="20" y="208" width="40" height="40" rx="10" fill="#DBEAFE" />
    <text x="40" y="234" text-anchor="middle" fill="#1C4E9E" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">03</text>
    <text x="20" y="274" fill="#0F2347" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Stages &amp; Immersion</text>
    <text x="20" y="300" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Stage M1 recommandé et stage M2 obligatoire</text>
    <text x="20" y="320" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">de 4 à 6 mois (Projet de Fin d’Études).</text>

    <rect x="340" y="188" width="316" height="164" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="360" y="208" width="40" height="40" rx="10" fill="#FEE2E2" />
    <text x="380" y="234" text-anchor="middle" fill="#D11623" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">04</text>
    <text x="360" y="274" fill="#0F2347" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Réseau d’Entreprises</text>
    <text x="360" y="300" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Visites terrain, séminaires startups &amp; IA</text>
    <text x="360" y="320" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">et opportunités avec les partenaires.</text>
  </g>
</svg>
